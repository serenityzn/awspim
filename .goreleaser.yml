version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: awspim
    binary: awspim
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: awspim-archive
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

dockers:
  - id: awspim-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/serenityzn/awspim:{{ .Tag }}-amd64"
      - "ghcr.io/serenityzn/awspim:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=awspim"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/serenityzn/awspim"
    extra_files:
      - ca-certificates.crt

  - id: awspim-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/serenityzn/awspim:{{ .Tag }}-arm64"
      - "ghcr.io/serenityzn/awspim:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=awspim"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/serenityzn/awspim"
    extra_files:
      - ca-certificates.crt

docker_manifests:
  - name_template: "ghcr.io/serenityzn/awspim:{{ .Tag }}"
    image_templates:
      - "ghcr.io/serenityzn/awspim:{{ .Tag }}-amd64"
      - "ghcr.io/serenityzn/awspim:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/serenityzn/awspim:latest"
    image_templates:
      - "ghcr.io/serenityzn/awspim:latest-amd64"
      - "ghcr.io/serenityzn/awspim:latest-arm64"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - 'typo'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Enhancements'
      regexp: '^.*?enhance(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: serenityzn
    name: awspim
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{.ProjectName}}-v{{.Version}}"
  header: |
    ## AWS PIM Release {{ .Tag }} ({{ .Date }})
    
    Welcome to this new release!
  footer: |
    ## Installation
    
    Download the appropriate binary for your platform from the assets below.
    
    ### Verification
    You can verify the integrity of downloaded files using the checksums.txt file.

